<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un girasol para Asmae</title>
<style>
:root{
  --bg1:#fff8dc; --bg2:#ffe9a3; --ink:#5a3a00; --soft:#8a6200;
  --p1:#ffd000; --p2:#ff9f00; --stem:#4c9a2a; --seed:#3b2200;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#1d1500;--bg2:#3a2a00;--ink:#ffe27a;--soft:#e0b84a}
}
:root[data-theme="dark"]{--bg1:#1d1500;--bg2:#3a2a00;--ink:#ffe27a;--soft:#e0b84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));
  font-family:"Georgia","Times New Roman",serif; color:var(--ink); overflow-x:hidden; text-align:center; padding:24px 16px;
}
h1{margin:0 0 4px; font-size:clamp(2rem,8vw,3.4rem); font-weight:normal; letter-spacing:.02em;
  opacity:0; transform:translateY(-12px); animation:in 1.2s .3s forwards}
.sub{margin:0 0 18px; color:var(--soft); font-style:italic; opacity:0; animation:in 1.2s .8s forwards}
@keyframes in{to{opacity:1;transform:none}}

.scene{position:relative; width:280px; height:460px; cursor:pointer; -webkit-tap-highlight-color:transparent}
.flower{position:absolute; left:50%; top:0; width:280px; height:280px; margin-left:-140px;
  animation:sway 5s ease-in-out infinite; transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.petal{
  position:absolute; left:50%; top:50%; width:46px; height:118px; margin-left:-23px; margin-top:-140px;
  transform-origin:50% 140px; border-radius:50% 50% 50% 50% / 88% 88% 12% 12%;
  background:linear-gradient(to top,var(--p2),var(--p1) 70%);
  box-shadow:inset 0 0 8px rgba(255,255,255,.35);
  transform:rotate(var(--a)) scale(0); animation:bloom .9s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay:var(--d);
}
.petal.back{filter:brightness(.88); width:50px}
@keyframes bloom{to{transform:rotate(var(--a)) scale(1)}}
.center{
  position:absolute; left:50%; top:50%; width:124px; height:124px; margin:-62px 0 0 -62px; border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg,rgba(255,200,80,.25) 0 6deg,transparent 6deg 12deg),
    radial-gradient(circle at 40% 35%,#7a4a10,var(--seed) 70%);
  box-shadow:0 0 0 6px rgba(90,50,0,.35), inset 0 0 18px #000; transform:scale(0); animation:pop .8s 1.9s forwards;
}
.center::after{content:""; position:absolute; inset:14px; border-radius:50%;
  background:radial-gradient(circle,transparent 30%,rgba(255,190,70,.18) 31% 34%,transparent 35% 50%,rgba(255,190,70,.14) 51% 54%,transparent 55%)}
@keyframes pop{to{transform:scale(1)}}
.stem{position:absolute; left:50%; top:270px; width:12px; height:190px; margin-left:-6px; border-radius:6px;
  background:linear-gradient(to right,#3d7d20,var(--stem),#3d7d20); transform-origin:top; transform:scaleY(0); animation:grow 1.2s forwards}
@keyframes grow{to{transform:scaleY(1)}}
.leaf{position:absolute; top:340px; width:84px; height:42px; background:linear-gradient(135deg,#6cc23f,#3d7d20);
  border-radius:0 100% 0 100%; opacity:0; animation:in 1s 1.2s forwards}
.leaf.l{left:50%; margin-left:-86px; transform:rotate(-8deg) scaleX(-1)}
.leaf.r{left:50%; margin-left:4px; top:385px; transform:rotate(8deg)}

.msg{min-height:3.6em; max-width:420px; margin:14px auto 0; font-size:1.15rem; line-height:1.5}
.hint{margin-top:6px; font-size:.85rem; color:var(--soft); opacity:.8}
.fall{position:fixed; top:-30px; pointer-events:none; border-radius:50% 50% 50% 50% / 88% 88% 12% 12%;
  background:linear-gradient(to top,var(--p2),var(--p1)); animation:drop linear forwards; z-index:5}
@keyframes drop{to{transform:translate(var(--dx),110vh) rotate(var(--r)); opacity:.6}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
  <h1>Asmae Ouarbia</h1>
  <p class="sub">13 de marzo · Esta flor es para ti con mucho cariño Johnny</p>

  <div class="scene" id="scene" role="button" aria-label="Toca el girasol">
    <div class="stem"></div>
    <div class="leaf l"></div>
    <div class="leaf r"></div>
    <div class="flower" id="flower"><div class="center"></div></div>
  </div>

  <p class="msg" id="msg"></p>
  <p class="hint">Toca el girasol 🌻</p>

<script>
(function(){
  var flower=document.getElementById('flower'), center=flower.querySelector('.center');
  function ring(n,cls,off,t0){
    for(var i=0;i<n;i++){
      var p=document.createElement('div');
      p.className='petal '+cls;
      p.style.setProperty('--a',(i*360/n+off)+'deg');
      p.style.setProperty('--d',(t0+i*0.035)+'s');
      flower.insertBefore(p,center);
    }
  }
  ring(18,'back',10,0.6);
  ring(18,'front',0,1.0);

  var lines=[
    "Asmae, que tu día sea tan brillante como tú. ☀️",
    "Gracias por ser luz en los días nublados.",
    "Ojalá siempre tengas motivos para sonreír.",
    "Eres de esas personas que hacen todo más bonito. 🌻",
    "Que la vida te trate tan lindo como mereces."
  ];
  var msg=document.getElementById('msg'), idx=0, timer=null;
  function type(t){
    clearInterval(timer); msg.textContent=''; var i=0;
    timer=setInterval(function(){ msg.textContent+=t[i++]; if(i>=t.length) clearInterval(timer); },38);
  }
  function rain(){
    for(var i=0;i<28;i++){
      var d=document.createElement('div'); d.className='fall';
      var w=10+Math.random()*12;
      d.style.width=w+'px'; d.style.height=w*2.4+'px';
      d.style.left=Math.random()*100+'vw';
      d.style.setProperty('--dx',(Math.random()*160-80)+'px');
      d.style.setProperty('--r',(Math.random()*720-360)+'deg');
      d.style.animationDuration=(3+Math.random()*3)+'s';
      d.style.animationDelay=(Math.random()*0.8)+'s';
      document.body.appendChild(d);
      setTimeout(function(el){el.remove()},7500,d);
    }
  }
  document.getElementById('scene').addEventListener('click',function(){
    rain(); type(lines[idx%lines.length]); idx++;
  });
  setTimeout(function(){ type("Para ti, Asmae. 🌻"); },3000);
})();
</script>
</body>
</html>
